name: Verify project

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      reproduce:
        description: Run all 575 training fits and compare frozen results
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.12.0'
          - os: windows-latest
            node: '24.13.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked web dependencies
        run: npm ci
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Test web, build and compare Python/Node predictions
        run: npm run verify
      - name: Acquire and verify UCI source
        run: python ml/download_data.py
      - name: Prepare and validate the frozen split
        run: python ml/data.py
      - name: Test source, split and artifact integrity
        run: python -m unittest discover -s ml -p "test_*.py" -v
      - name: Reproduce the frozen experiment in a separate directory
        if: github.event_name == 'workflow_dispatch' && inputs.reproduce
        run: python scripts/reproduce.py
